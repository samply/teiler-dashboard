<div class="translate-wrapper">

  <button mat-button [matMenuTriggerFor]="menu"><i class="bi bi-translate"></i></button>
  <mat-menu #menu="matMenu">
    @for (languageHref of availableLanguages; track languageHref) {
      <a mat-menu-item routerLink="/placeholder" [externalLink]="languageHref.href">
        {{languageHref.language}}
      </a>
    }
  </mat-menu>

</div>
